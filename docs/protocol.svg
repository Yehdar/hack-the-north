<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 570" width="1180" height="570" role="img" aria-label="The five-round deliberation protocol as a swimlane. A non-voting chair decomposes the decision into diligence tasks and assigns them by lane. Agents answer blind in round one, issue directed challenges at each other in round two, rebut or concede in round three, the chair then rules each challenge answered or dodged, and a devil's advocate attacks the settled consensus in round four before weighted synthesis.">
  <defs>
    <marker id="pInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#22262c"/>
    </marker>
    <marker id="pCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e0512c"/>
    </marker>
    <marker id="pSteel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4d7ead"/>
    </marker>
    <marker id="pDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b8577"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="570" fill="#f2efe6"/>

  <text x="24" y="30" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#22262c">The deliberation protocol — one engine, five rounds</text>
  <text x="1156" y="30" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#6b7079">src/lib/agents/protocol.ts</text>

  <!-- lane stripes -->
  <g>
    <rect x="24" y="100" width="1128" height="48" rx="5" fill="#e2ddcd"/>
    <rect x="24" y="160" width="1128" height="48" rx="5" fill="#e9e5d9"/>
    <rect x="24" y="220" width="1128" height="48" rx="5" fill="#e9e5d9"/>
    <rect x="24" y="280" width="1128" height="48" rx="5" fill="#e9e5d9"/>
    <rect x="24" y="340" width="1128" height="48" rx="5" fill="#ece7db"/>
  </g>

  <!-- column separators -->
  <g stroke="#d5cfbd" stroke-width="1">
    <path d="M332 96 L332 392"/>
    <path d="M496 96 L496 392"/>
    <path d="M660 96 L660 392"/>
    <path d="M824 96 L824 392"/>
    <path d="M988 96 L988 392"/>
  </g>

  <!-- column headers -->
  <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="250"  y="62" font-size="9.5" letter-spacing="1.1" fill="#8b8577">ROUND 0</text>
    <text x="250"  y="78" font-size="11.5" font-weight="500" fill="#22262c">DECOMPOSE</text>
    <text x="414"  y="62" font-size="9.5" letter-spacing="1.1" fill="#8b8577">ROUND 1</text>
    <text x="414"  y="78" font-size="11.5" font-weight="500" fill="#22262c">INDEPENDENT</text>
    <text x="578"  y="62" font-size="9.5" letter-spacing="1.1" fill="#8b8577">ROUND 2</text>
    <text x="578"  y="78" font-size="11.5" font-weight="500" fill="#22262c">CROSS-EXAMINE</text>
    <text x="742"  y="62" font-size="9.5" letter-spacing="1.1" fill="#8b8577">ROUND 3</text>
    <text x="742"  y="78" font-size="11.5" font-weight="500" fill="#22262c">REBUT</text>
    <text x="906"  y="62" font-size="9.5" letter-spacing="1.1" fill="#8b8577">CHAIR</text>
    <text x="906"  y="78" font-size="11.5" font-weight="500" fill="#22262c">RULES</text>
    <text x="1070" y="62" font-size="9.5" letter-spacing="1.1" fill="#8b8577">ROUND 4</text>
    <text x="1070" y="78" font-size="11.5" font-weight="500" fill="#22262c">ADVERSARIAL</text>
  </g>
  <path d="M24 88 L1152 88" stroke="#c9c3b0" stroke-width="1"/>

  <!-- lane labels -->
  <g text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" fill="#22262c">
    <text x="148" y="128" font-weight="700">Chair</text>
    <text x="148" y="188" font-weight="600">General Partner</text>
    <text x="148" y="248" font-weight="600">Principal</text>
    <text x="148" y="308" font-weight="600">Skeptic</text>
    <text x="148" y="368" font-weight="600">Devil's Advocate</text>
  </g>
  <g text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#8b8577">
    <text x="148" y="141">non-voting</text>
    <text x="148" y="201">weight .50 · temp .6</text>
    <text x="148" y="261">weight .30 · temp .4</text>
    <text x="148" y="321">weight .20 · temp .9</text>
    <text x="148" y="381">structural · temp 1.0</text>
  </g>

  <!-- ===== ROUND 0 — chair decomposes and assigns ===== -->
  <rect x="184" y="106" width="132" height="36" rx="5" fill="#dcd7c6" stroke="#8b8577"/>
  <text x="250" y="121" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#2c2a24">splits into 5–7</text>
  <text x="250" y="134" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#2c2a24">diligence tasks</text>

  <g stroke="#8b8577" stroke-width="1.3" fill="none">
    <path d="M250 142 L250 304"/>
    <path d="M250 184 L326 184" marker-end="url(#pDim)"/>
    <path d="M250 244 L326 244" marker-end="url(#pDim)"/>
    <path d="M250 304 L326 304" marker-end="url(#pDim)"/>
  </g>

  <!-- ===== ROUND 1 — blind independent pass ===== -->
  <g>
    <rect x="348" y="166" width="132" height="36" rx="5" fill="#fbf9f4" stroke="#b9b3a2"/>
    <text x="414" y="181" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#22262c">market + fund math</text>
    <text x="414" y="194" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#8b8577">stance + confidence</text>

    <rect x="348" y="226" width="132" height="36" rx="5" fill="#fbf9f4" stroke="#b9b3a2"/>
    <text x="414" y="241" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#22262c">unit economics</text>
    <text x="414" y="254" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#8b8577">stance + confidence</text>

    <rect x="348" y="286" width="132" height="36" rx="5" fill="#fbf9f4" stroke="#b9b3a2"/>
    <text x="414" y="301" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#22262c">what we passed on</text>
    <text x="414" y="314" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#8b8577">stance + confidence</text>
  </g>

  <!-- ===== ROUND 2 — directed challenges ===== -->
  <g stroke="#e0512c" stroke-width="1.4" fill="none">
    <path d="M540 236 L540 194" marker-end="url(#pCoral)"/>
    <path d="M578 296 L578 194" marker-end="url(#pCoral)"/>
    <path d="M616 194 L616 294" marker-end="url(#pCoral)"/>
  </g>
  <g fill="#e0512c">
    <circle cx="540" cy="238" r="2.4"/>
    <circle cx="578" cy="298" r="2.4"/>
    <circle cx="616" cy="192" r="2.4"/>
  </g>

  <!-- ===== ROUND 3 — rebuttal and belief revision ===== -->
  <g stroke="#4d7ead" stroke-width="1.4" fill="none">
    <path d="M706 194 L706 234" marker-end="url(#pSteel)"/>
    <path d="M742 194 L742 294" marker-end="url(#pSteel)"/>
    <path d="M778 296 L778 194" marker-end="url(#pSteel)"/>
  </g>
  <circle cx="742" cy="298" r="4.5" fill="#e0512c"/>

  <!-- ===== CHAIR RULES ===== -->
  <rect x="840" y="106" width="132" height="36" rx="5" fill="#dcd7c6" stroke="#8b8577"/>
  <text x="906" y="121" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#2c2a24">answered — yes/no</text>
  <text x="906" y="134" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#2c2a24">+ reason</text>
  <path d="M906 300 L906 148" stroke="#8b8577" stroke-width="1.3" stroke-dasharray="4 4" fill="none" marker-end="url(#pDim)"/>

  <!-- ===== ROUND 4 — adversarial ===== -->
  <path d="M1070 196 L1070 342" stroke="#8b8577" stroke-width="1.3" stroke-dasharray="4 4" fill="none" marker-end="url(#pDim)"/>
  <rect x="1019" y="346" width="102" height="36" rx="5" fill="#ffe0d5" stroke="#ff6a45"/>
  <text x="1070" y="361" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#40190f">attacks the</text>
  <text x="1070" y="374" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#40190f">consensus</text>

  <!-- ===== PER-ROUND CAPTIONS ===== -->
  <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#8b8577">
    <text x="250" y="404">assigned by lane</text>
    <text x="414" y="404">blind — nobody anchors</text>
    <text x="578" y="404">≤2, addressed by id</text>
    <text x="742" y="404">answer or concede</text>
    <text x="906" y="404">restating ≠ answering</text>
  </g>
  <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#e0512c">
    <text x="742" y="418">● moved = emergence</text>
    <text x="906" y="418">unanswered: −0.08</text>
  </g>

  <!-- ===== SYNTHESIS ===== -->
  <path d="M1070 382 L1070 428" stroke="#e0512c" stroke-width="1.4" fill="none" marker-end="url(#pCoral)"/>

  <rect x="168" y="432" width="984" height="74" rx="6" fill="#dcd7c6" stroke="#8b8577"/>
  <text x="188" y="454" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#2c2a24">Weighted synthesis — confidence gates seat authority, dissent is preserved rather than smoothed</text>
  <text x="188" y="476" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#2c2a24">S = Σ(w′ᵢ · cᵢ · sᵢ) / Σ(w′ᵢ · cᵢ)   −   0.08 × unanswered      →      S ≥ 0.35 invest   ·   −0.10…0.35 conditional   ·   &lt; −0.10 pass</text>
  <text x="188" y="495" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6b6555">a lone hard no is promoted to the top of the report when |sᵢ − S| &gt; 0.6 — the one output averaging destroys</text>

  <!-- ===== LEGEND ===== -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6b7079">
    <path d="M24 538 L60 538" stroke="#e0512c" stroke-width="1.4" fill="none" marker-end="url(#pCoral)"/>
    <text x="68" y="542">challenge</text>

    <path d="M168 538 L204 538" stroke="#4d7ead" stroke-width="1.4" fill="none" marker-end="url(#pSteel)"/>
    <text x="212" y="542">rebuttal</text>

    <path d="M300 538 L336 538" stroke="#8b8577" stroke-width="1.3" stroke-dasharray="4 4" fill="none" marker-end="url(#pDim)"/>
    <text x="344" y="542">observes / rules</text>

    <circle cx="486" cy="538" r="4.5" fill="#e0512c"/>
    <text x="498" y="542">concession — stance moves</text>

    <text x="1152" y="542" text-anchor="end" fill="#8b8577">typed + threaded by inReplyTo</text>
  </g>
</svg>
