<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 790" width="1100" height="790" role="img" aria-label="Vision system architecture: five layers. The Next.js client routes call three API families; discovery and VC routes drive the Discovery Engine and Defense Engine, which both feed one shared five-round deliberation protocol; every model call funnels through the LLM router to OpenAI or Anthropic, while the voice path bypasses the engine layer entirely and reaches ElevenLabs through the voice router.">
  <defs>
    <marker id="aInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#22262c"/>
    </marker>
    <marker id="aSteel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4d7ead"/>
    </marker>
    <marker id="aCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e0512c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="790" fill="#f2efe6"/>

  <text x="24" y="32" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#22262c">Vision — system architecture</text>
  <text x="1076" y="32" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#6b7079">Next.js 16 · React 19 · TypeScript</text>

  <!-- ================= BANDS ================= -->
  <g fill="#e7e3d6">
    <rect x="24" y="52"  width="1052" height="92"  rx="8"/>
    <rect x="24" y="180" width="1052" height="116" rx="8"/>
    <rect x="24" y="328" width="1052" height="150" rx="8"/>
    <rect x="24" y="514" width="1052" height="110" rx="8"/>
    <rect x="24" y="660" width="1052" height="80"  rx="8"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.2" fill="#6b7079">
    <text x="40" y="72">1 · CLIENT — NEXT.JS APP ROUTER</text>
    <text x="40" y="200">2 · API — ROUTE HANDLERS</text>
    <text x="40" y="348">3 · ENGINE — SRC/LIB</text>
    <text x="40" y="534">4 · PROVIDERS — SWAPPABLE, KEY-OPTIONAL</text>
    <text x="40" y="680">5 · EXTERNAL</text>
  </g>

  <!-- ================= BAND 1 — ROUTES ================= -->
  <g>
    <rect x="40"  y="86" width="188" height="40" rx="6" fill="#fbf9f4" stroke="#b9b3a2"/>
    <text x="134" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#22262c">/</text>
    <text x="134" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6b7079">front door — saved runs</text>

    <rect x="248" y="86" width="188" height="40" rx="6" fill="#dfeaf5" stroke="#6d97c4"/>
    <text x="342" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1b2b3a">/study</text>
    <text x="342" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4d6a85">Part 1 — market + reveal</text>

    <rect x="456" y="86" width="188" height="40" rx="6" fill="#ffe0d5" stroke="#ff6a45"/>
    <text x="550" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#40190f">/committee</text>
    <text x="550" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8a4630">Part 2 — IC meeting, voice</text>

    <rect x="664" y="86" width="188" height="40" rx="6" fill="#ffe0d5" stroke="#ff6a45"/>
    <text x="758" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#40190f">/report</text>
    <text x="758" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8a4630">verdict + live re-weight</text>

    <rect x="872" y="86" width="188" height="40" rx="6" fill="#f2efe6" stroke="#cfc8b6" stroke-dasharray="4 3"/>
    <text x="966" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b8577">/dashboard</text>
    <text x="966" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b8577">legacy — redirects to /</text>
  </g>

  <!-- client fan-out bus -->
  <g stroke="#22262c" stroke-width="1.3" fill="none">
    <path d="M342 126 L342 154"/>
    <path d="M550 126 L550 154"/>
    <path d="M185 154 L895 154"/>
  </g>
  <text x="134" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#a8a294">client-only</text>
  <text x="758" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#a8a294">client-only — re-weight is a pure function</text>
  <path d="M185 154 L185 210" stroke="#4d7ead" stroke-width="1.4" fill="none" marker-end="url(#aSteel)"/>
  <path d="M530 154 L530 210" stroke="#e0512c" stroke-width="1.4" fill="none" marker-end="url(#aCoral)"/>
  <path d="M895 154 L895 210" stroke="#e0512c" stroke-width="1.4" fill="none" marker-end="url(#aCoral)"/>

  <!-- ================= BAND 2 — API ================= -->
  <g>
    <rect x="40" y="214" width="290" height="66" rx="6" fill="#dfeaf5" stroke="#6d97c4"/>
    <text x="185" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1b2b3a">/api/discovery</text>
    <text x="185" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#4d6a85">run · refine · persona</text>
    <text x="185" y="268" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#4d6a85">summary — SSE stream</text>

    <rect x="370" y="214" width="320" height="66" rx="6" fill="#ffe0d5" stroke="#ff6a45"/>
    <text x="530" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#40190f">/api/vc</text>
    <text x="530" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8a4630">preread · deliberate · ask</text>
    <text x="530" y="268" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8a4630">turn · firms</text>

    <rect x="730" y="214" width="330" height="66" rx="6" fill="#ffe0d5" stroke="#ff6a45"/>
    <text x="895" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#40190f">/api/voice</text>
    <text x="895" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8a4630">stt · tts · status</text>
    <text x="895" y="268" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8a4630">ElevenLabs, else browser</text>
  </g>

  <!-- band 2 -> band 3 -->
  <path d="M185 280 L185 358" stroke="#4d7ead" stroke-width="1.4" fill="none" marker-end="url(#aSteel)"/>
  <text x="194" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#6b7079">problems + crowd</text>

  <path d="M530 280 L530 318 L865 318 L865 358" stroke="#e0512c" stroke-width="1.4" fill="none" marker-end="url(#aCoral)"/>
  <text x="700" y="311" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#6b7079">pitch turns + objections</text>

  <!-- voice bypasses the engine layer entirely -->
  <path d="M1035 280 L1035 544" stroke="#e0512c" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#aCoral)"/>
  <text x="1026" y="324" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#6b7079">audio in / out</text>
  <text x="1026" y="504" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#6b7079">speech never deliberates</text>

  <!-- ================= BAND 3 — ENGINE ================= -->
  <text x="350" y="356" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#6b7079">hub roster</text>
  <text x="710" y="356" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#6b7079">VC roster</text>

  <g>
    <rect x="40" y="362" width="290" height="100" rx="6" fill="#dfeaf5" stroke="#6d97c4"/>
    <text x="185" y="386" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1b2b3a">Discovery Engine</text>
    <text x="185" y="408" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#4d6a85">problems → crowd → signals</text>
    <text x="185" y="426" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#4d6a85">rank → aggregate</text>
    <text x="185" y="446" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#4d6a85">pvs.ts — score /100</text>

    <rect x="370" y="362" width="320" height="100" rx="6" fill="#dcd7c6" stroke="#8b8577"/>
    <text x="530" y="386" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2c2a24">Deliberation Protocol</text>
    <text x="530" y="406" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6b6555">agents/protocol.ts — one engine</text>
    <text x="530" y="424" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6b6555">decompose · blind · cross-examine</text>
    <text x="530" y="440" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6b6555">rebut · chair rules · adversarial</text>
    <text x="530" y="456" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6b6555">emits variance · rulings · mindChanges</text>

    <rect x="730" y="362" width="270" height="100" rx="6" fill="#ffe0d5" stroke="#ff6a45"/>
    <text x="865" y="386" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#40190f">Defense Engine</text>
    <text x="865" y="408" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8a4630">seats → moderator → speak</text>
    <text x="865" y="426" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8a4630">minutes.ts</text>
    <text x="865" y="446" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8a4630">verdict.ts — weighted, dissent kept</text>
  </g>

  <!-- both rosters converge inward on the shared protocol -->
  <path d="M330 412 L366 412" stroke="#4d7ead" stroke-width="1.4" fill="none" marker-end="url(#aSteel)"/>
  <path d="M730 412 L694 412" stroke="#e0512c" stroke-width="1.4" fill="none" marker-end="url(#aCoral)"/>

  <!-- band 3 -> band 4 -->
  <path d="M185 462 L185 544" stroke="#4d7ead" stroke-width="1.4" fill="none" marker-end="url(#aSteel)"/>
  <path d="M530 462 L530 544" stroke="#22262c" stroke-width="1.4" fill="none" marker-end="url(#aInk)"/>
  <path d="M865 462 L865 502 L640 502 L640 544" stroke="#e0512c" stroke-width="1.4" fill="none" marker-end="url(#aCoral)"/>
  <text x="539" y="494" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#6b7079">every call is schema-validated JSON</text>

  <!-- ================= BAND 4 — PROVIDERS ================= -->
  <g>
    <rect x="40" y="548" width="650" height="62" rx="6" fill="#dcd7c6" stroke="#8b8577"/>
    <text x="365" y="570" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2c2a24">LLM router — src/lib/llm.ts</text>
    <text x="365" y="588" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6b6555">openai → anthropic → gemini → demo   ·   first key present wins</text>
    <text x="365" y="603" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6b6555">no key at all = demo provider, fully offline</text>

    <rect x="730" y="548" width="330" height="62" rx="6" fill="#ffe0d5" stroke="#ff6a45"/>
    <text x="895" y="572" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#40190f">Voice router — src/lib/voice</text>
    <text x="895" y="594" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8a4630">elevenlabs → openai tts → web speech</text>
  </g>

  <!-- band 4 -> band 5 -->
  <path d="M170 610 L170 688" stroke="#22262c" stroke-width="1.4" fill="none" marker-end="url(#aInk)"/>
  <path d="M370 610 L370 688" stroke="#22262c" stroke-width="1.4" fill="none" marker-end="url(#aInk)"/>
  <path d="M570 610 L570 688" stroke="#22262c" stroke-width="1.4" fill="none" marker-end="url(#aInk)"/>
  <path d="M895 610 L895 688" stroke="#e0512c" stroke-width="1.4" fill="none" marker-end="url(#aCoral)"/>

  <!-- ================= BAND 5 — EXTERNAL ================= -->
  <g>
    <rect x="80" y="692" width="180" height="36" rx="18" fill="#fbf9f4" stroke="#b9b3a2"/>
    <text x="170" y="715" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#22262c">OpenAI API</text>

    <rect x="280" y="692" width="180" height="36" rx="18" fill="#fbf9f4" stroke="#b9b3a2"/>
    <text x="370" y="715" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#22262c">Anthropic API</text>

    <rect x="480" y="692" width="180" height="36" rx="18" fill="#fbf9f4" stroke="#b9b3a2"/>
    <text x="570" y="715" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#22262c">Gemini API</text>
    <text x="570" y="745" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#8b8577">free tier — runs the public deploy</text>

    <rect x="785" y="692" width="220" height="36" rx="18" fill="#fbf9f4" stroke="#b9b3a2"/>
    <text x="895" y="715" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#22262c">ElevenLabs API</text>
  </g>

  <!-- ================= LEGEND ================= -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6b7079">
    <rect x="40" y="759" width="10" height="10" rx="2" fill="#dfeaf5" stroke="#6d97c4"/>
    <text x="58" y="768">Track A — Discovery</text>

    <rect x="240" y="759" width="10" height="10" rx="2" fill="#ffe0d5" stroke="#ff6a45"/>
    <text x="258" y="768">Track B — Defense</text>

    <rect x="430" y="759" width="10" height="10" rx="2" fill="#dcd7c6" stroke="#8b8577"/>
    <text x="448" y="768">Shared</text>

    <path d="M540 764 L576 764" stroke="#e0512c" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>
    <text x="584" y="768">voice path — skips the engine</text>

    <text x="1060" y="768" text-anchor="end" fill="#8b8577">/api/system/check omitted</text>
  </g>
</svg>
